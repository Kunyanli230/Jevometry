[project]
name = "jevometry"
version = "0.1.0"
description = "Information-geometric analysis of Jev agent systems"
authors = [{ name = "Jevometry maintainers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "typer>=0.27,<1",
    "plotly>=6,<7",
    "jinja2>=3.1,<4",
]

[project.scripts]
jevometry = "jevometry.cli:main"

[project.optional-dependencies]
live = ["typesafe-sdk>=0.7.1,<1"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "hypothesis>=6,<7",
    "ruff>=0.15,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6,<7",
    "build>=1,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevometry"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/jevometry/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jevometry"]

[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*", "typesafe_sdk.*", "httpx2.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["jevometry"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: explicit opt-in tests requiring TypeSafe credentials and API access"]
