<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Jevometry's declared decision path</title>
  <desc id="desc">Evidence and ambiguity feed three agent probability distributions. A declared product joint combines them. A fixed mapping produces the final cleaning action.</desc>
  <rect width="1200" height="430" rx="26" fill="#0D1725"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="55" fill="#66D3C8" font-size="19" font-weight="700" letter-spacing="2">JEVOMETRY / DECLARED MODEL</text>
    <text x="1146" y="55" fill="#A8B7C8" font-size="18" text-anchor="end">three-agent cleaning council</text>
    <path d="M54 77H1146" stroke="#2B3B4D" stroke-width="2"/>

    <g fill="none" stroke="#66D3C8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".86">
      <path d="M278 236H296V149H320"/>
      <path d="M296 236H320"/>
      <path d="M296 236V323H320"/>
      <path d="M600 149H630V236H660"/>
      <path d="M600 236H660"/>
      <path d="M600 323H630V236"/>
    </g>
    <path d="M900 236H934" stroke="#F3BD72" stroke-width="3" stroke-linecap="round"/>
    <path d="m931 229 10 7-10 7" fill="none" stroke="#F3BD72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="54" y="135" width="224" height="202" rx="18" fill="#152435" stroke="#3C5268" stroke-width="2"/>
    <text x="78" y="176" fill="#A8B7C8" font-size="18" font-weight="700" letter-spacing="1.5">INPUT</text>
    <text x="78" y="226" fill="#F4F7F8" font-size="38" font-weight="650">θ</text>
    <text x="78" y="271" fill="#D9E4E9" font-size="22">evidence</text>
    <text x="78" y="304" fill="#D9E4E9" font-size="22">ambiguity</text>

    <g fill="#152435" stroke="#3C5268" stroke-width="2">
      <rect x="320" y="116" width="280" height="66" rx="14"/>
      <rect x="320" y="203" width="280" height="66" rx="14"/>
      <rect x="320" y="290" width="280" height="66" rx="14"/>
    </g>
    <text x="341" y="157" fill="#F4F7F8" font-size="23" font-weight="650">Applicability</text>
    <text x="577" y="156" fill="#66D3C8" font-size="19" text-anchor="end">Noul</text>
    <text x="341" y="244" fill="#F4F7F8" font-size="23" font-weight="650">Repair</text>
    <text x="577" y="243" fill="#66D3C8" font-size="19" text-anchor="end">Choice</text>
    <text x="341" y="331" fill="#F4F7F8" font-size="23" font-weight="650">Risk</text>
    <text x="577" y="330" fill="#66D3C8" font-size="19" text-anchor="end">Score</text>

    <rect x="660" y="167" width="240" height="138" rx="18" fill="#15303A" stroke="#66D3C8" stroke-width="2"/>
    <text x="682" y="200" fill="#95E5DD" font-size="18" font-weight="700" letter-spacing="1">PRODUCT JOINT</text>
    <text x="682" y="248" fill="#F4F7F8" font-size="28" font-weight="650">P(A, R, K | θ)</text>
    <text x="682" y="280" fill="#BDD3D7" font-size="18">independent given θ</text>

    <rect x="942" y="167" width="204" height="138" rx="18" fill="#34291F" stroke="#F3BD72" stroke-width="2"/>
    <text x="964" y="200" fill="#F3BD72" font-size="18" font-weight="700" letter-spacing="1">FIXED MAP</text>
    <text x="964" y="248" fill="#F4F7F8" font-size="24" font-weight="650">Final action</text>
    <text x="964" y="280" fill="#F8D8A6" font-size="18">information loss</text>

    <text x="54" y="390" fill="#A8B7C8" font-size="18">Example model · offline · one fixed candidate repair</text>
